<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 36" width="1000" height="36" role="img" aria-label="Pembatas gelombang laut">
  <defs>
    <linearGradient id="pudar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#fff"/>
      <stop offset="0.82" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="tepi" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="36">
      <rect width="1000" height="36" fill="url(#pudar)"/>
    </mask>
  </defs>

  <style>
    .a { animation: geser 12s linear infinite; }
    .b { animation: geser 8s linear infinite reverse; }
    .c { animation: geser 5s linear infinite; }
    @keyframes geser { from { transform: translateX(0); } to { transform: translateX(-250px); } }
  </style>

  <g mask="url(#tepi)" fill="none" stroke-linecap="round">
    <path class="a" stroke="#0b4f7a" stroke-width="3.5" d="M0,18 q62.5,-9 125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0"/>
    <path class="b" stroke="#00b4d8" stroke-width="2.5" stroke-opacity=".9" d="M0,18 q62.5,-8 125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0"/>
    <path class="c" stroke="#90e0ef" stroke-width="1.5" stroke-opacity=".7" d="M0,18 q62.5,-6 125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0"/>
  </g>
</svg>
