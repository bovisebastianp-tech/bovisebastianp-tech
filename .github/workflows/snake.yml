name: Generate Snake

on:
  # otomatis jalan tiap 12 jam
  schedule:
    - cron: "0 */12 * * *"
  # bisa dijalankan manual dari tab Actions
  workflow_dispatch:
  # jalan juga tiap ada commit ke main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Buat animasi ular dari grafik kontribusi
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0A0A0B&color_dots=#EDEDEB,#C8C8C4,#9A9AA0,#5C5C62,#0A0A0B
            dist/github-snake-dark.svg?color_snake=#F4F4F2&color_dots=#17171A,#2A2A2E,#5C5C62,#9A9AA0,#F4F4F2

      - name: Simpan hasilnya ke branch "output"
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
