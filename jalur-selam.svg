<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Jalur selam: HTML, CSS, JavaScript, UI/UX, lalu proyek berikutnya">
  <defs>
    <linearGradient id="laut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050d1a"/>
      <stop offset="0.55" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0b4f7a"/>
    </linearGradient>
    <linearGradient id="jejak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0077b6"/>
      <stop offset="0.6" stop-color="#48cae4"/>
      <stop offset="1" stop-color="#90e0ef"/>
    </linearGradient>
    <filter id="cahaya" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="bingkai">
      <rect width="1000" height="280" rx="18"/>
    </clipPath>
    <path id="jalur" d="M90,150 C147,100 238,200 295,150 S443,200 500,150 S648,200 705,150 S853,200 910,150"/>
  </defs>

  <style>
    .nm { font: 700 18px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #caf0f8; text-anchor: middle; }
    .sb { font: 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #90e0ef; text-anchor: middle; }

    .k { animation: kedip 3.4s ease-in-out infinite; }
    @keyframes kedip { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }

    .alir { animation: alir 3s linear infinite; }
    @keyframes alir { to { stroke-dashoffset: -60; } }

    .g1 { animation: geser 10s linear infinite; }
    .g2 { animation: geser 7s linear infinite reverse; }
    @keyframes geser { from { transform: translateX(0); } to { transform: translateX(-500px); } }

    .gel { animation: naik 7s ease-in infinite; }
    @keyframes naik {
      0%   { transform: translateY(0); opacity: 0; }
      15%  { opacity: .8; }
      100% { transform: translateY(-120px); opacity: 0; }
    }

    .apung { animation: apung 2.2s ease-in-out infinite alternate; }
    @keyframes apung { from { transform: translateY(-3px); } to { transform: translateY(3px); } }
  </style>

  <g clip-path="url(#bingkai)">
    <rect width="1000" height="280" fill="url(#laut)"/>

    <!-- bintang -->
    <g fill="#caf0f8">
      <circle class="k" cx="50"  cy="30" r="1.4" style="animation-delay:0s"/>
      <circle class="k" cx="140" cy="70" r="1"   style="animation-delay:-1s"/>
      <circle class="k" cx="200" cy="25" r="1.2" style="animation-delay:-2s"/>
      <circle class="k" cx="300" cy="85" r="1"   style="animation-delay:-.5s"/>
      <circle class="k" cx="420" cy="72" r="1.4" style="animation-delay:-1.5s"/>
      <circle class="k" cx="560" cy="80" r="1"   style="animation-delay:-2.5s"/>
      <circle class="k" cx="650" cy="90" r="1.2" style="animation-delay:-3s"/>
      <circle class="k" cx="730" cy="72" r="1"   style="animation-delay:-.8s"/>
      <circle class="k" cx="810" cy="30" r="1.4" style="animation-delay:-2.2s"/>
      <circle class="k" cx="880" cy="75" r="1"   style="animation-delay:-1.2s"/>
      <circle class="k" cx="950" cy="35" r="1.2" style="animation-delay:-1.8s"/>
      <circle class="k" cx="30"  cy="112" r="1"  style="animation-delay:-2.6s"/>
      <circle class="k" cx="970" cy="112" r="1"  style="animation-delay:-.4s"/>
    </g>

    <text x="500" y="46" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" letter-spacing="4" fill="#90e0ef">JALUR SELAM · PETA BELAJAR GUE</text>

    <!-- ombak dasar -->
    <path class="g1" fill="#0b4f7a" fill-opacity=".9" d="M0,250 q62.5,-9 125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 V300 H0 Z"/>
    <path class="g2" fill="#0077b6" fill-opacity=".75" d="M0,264 q62.5,-12 125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 V300 H0 Z"/>

    <!-- jalur -->
    <use href="#jalur" fill="none" stroke="url(#jejak)" stroke-width="5" stroke-linecap="round" filter="url(#cahaya)"/>
    <use class="alir" href="#jalur" fill="none" stroke="#caf0f8" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 14"/>

    <!-- titik 1: HTML -->
    <circle cx="90" cy="150" r="14" fill="none" stroke="#48cae4" stroke-width="2">
      <animate attributeName="r" values="14;26;14" dur="3s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0;.7" dur="3s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="150" r="12" fill="#0a1628" stroke="#48cae4" stroke-width="3"/>
    <circle cx="90" cy="150" r="5" fill="#caf0f8"/>
    <text class="nm" x="90" y="112">HTML</text>
    <text class="sb" x="90" y="202">dasar laut</text>

    <!-- titik 2: CSS -->
    <circle cx="295" cy="150" r="14" fill="none" stroke="#48cae4" stroke-width="2">
      <animate attributeName="r" values="14;26;14" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0;.7" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="295" cy="150" r="12" fill="#0a1628" stroke="#48cae4" stroke-width="3"/>
    <circle cx="295" cy="150" r="5" fill="#caf0f8"/>
    <text class="nm" x="295" y="112">CSS</text>
    <text class="sb" x="295" y="202">arus &amp; warna</text>

    <!-- titik 3: JavaScript -->
    <circle cx="500" cy="150" r="14" fill="none" stroke="#48cae4" stroke-width="2">
      <animate attributeName="r" values="14;26;14" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0;.7" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="150" r="12" fill="#0a1628" stroke="#48cae4" stroke-width="3"/>
    <circle cx="500" cy="150" r="5" fill="#caf0f8"/>
    <text class="nm" x="500" y="112">JavaScript</text>
    <text class="sb" x="500" y="202">denyut halaman</text>

    <!-- titik 4: UI/UX -->
    <circle cx="705" cy="150" r="14" fill="none" stroke="#48cae4" stroke-width="2">
      <animate attributeName="r" values="14;26;14" dur="3s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0;.7" dur="3s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="705" cy="150" r="12" fill="#0a1628" stroke="#48cae4" stroke-width="3"/>
    <circle cx="705" cy="150" r="5" fill="#caf0f8"/>
    <text class="nm" x="705" y="112">UI/UX</text>
    <text class="sb" x="705" y="202">mata tajam detail</text>

    <!-- titik 5: berikutnya -->
    <circle cx="910" cy="150" r="14" fill="none" stroke="#90e0ef" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="r" values="14;26;14" dur="3s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0;.8" dur="3s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="910" cy="150" r="12" fill="#0a1628" stroke="#90e0ef" stroke-width="3" stroke-dasharray="5 4"/>
    <circle cx="910" cy="150" r="4" fill="#90e0ef" fill-opacity=".6"/>
    <text class="nm" x="910" y="112">Berikutnya</text>
    <text class="sb" x="910" y="202">masih di kedalaman</text>

    <!-- gelembung -->
    <g fill="none" stroke="#caf0f8" stroke-width="1.5">
      <circle class="gel" cx="150" cy="275" r="3" style="animation-delay:-1s"/>
      <circle class="gel" cx="380" cy="278" r="4" style="animation-delay:-3s"/>
      <circle class="gel" cx="620" cy="275" r="3" style="animation-delay:-5s"/>
      <circle class="gel" cx="820" cy="278" r="4" style="animation-delay:-2s"/>
    </g>

    <!-- kapal selam menyusuri jalur -->
    <g>
      <animateMotion dur="16s" repeatCount="indefinite" rotate="auto">
        <mpath href="#jalur"/>
      </animateMotion>
      <g class="apung">
        <path d="M-21,0 L-30,-7 L-30,7 Z" fill="#0077b6"/>
        <ellipse cx="0" cy="0" rx="21" ry="9" fill="#48cae4"/>
        <rect x="-4" y="-16" width="11" height="8" rx="3" fill="#48cae4"/>
        <rect x="3" y="-22" width="2.2" height="7" fill="#90e0ef"/>
        <rect x="3" y="-22" width="8" height="2.2" fill="#90e0ef"/>
        <circle cx="9" cy="-1" r="3.6" fill="#0a1628"/>
        <circle cx="9" cy="-1" r="3.6" fill="none" stroke="#caf0f8" stroke-width="1.2"/>
        <circle cx="-3" cy="-1" r="2.6" fill="#0a1628"/>
        <circle cx="-3" cy="-1" r="2.6" fill="none" stroke="#caf0f8" stroke-width="1.2"/>
      </g>
    </g>
  </g>

  <rect x=".5" y=".5" width="999" height="279" rx="18" fill="none" stroke="#0b4f7a" stroke-opacity=".6"/>
</svg>
