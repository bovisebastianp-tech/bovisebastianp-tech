<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Perjalanan belajar: HTML, CSS, JavaScript, UI/UX, lalu proyek yang lebih kompleks yang belum sampai."><defs></defs><style>
