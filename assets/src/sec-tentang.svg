<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 100" width="880" height="100" role="img" aria-label="01. Tentang"><defs></defs><style>
text{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
.s{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.m{font-family:ui-monospace,'SF Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace}
@keyframes fall{from{transform:translate(0,-90px)}to{transform:translate(-26px,var(--h))}}
@keyframes rip{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1);opacity:0}}
@keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.rp{transform-box:fill-box;transform-origin:center;animation:rip 3s ease-out infinite both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.d{animation:dr 5s ease-in infinite}@keyframes dr{0%{transform:translateY(-14px);opacity:0}30%{opacity:1}100%{transform:translateY(30px);opacity:0}}</style><rect width="880" height="100" fill="#F1F1EF"/><text class="m" x="40" y="46" font-size="14" fill="#8C8C92" letter-spacing="3">01 / 07</text><text class="s" x="38" y="84" font-size="44" font-weight="700" fill="#0A0A0B" letter-spacing="-1.2">Tentang</text><line x1="680" y1="99" x2="840" y2="99" stroke="#0A0A0B" stroke-width="2"/><circle class="d" cx="760" cy="40" r="3.5" fill="#0A0A0B"/></svg>