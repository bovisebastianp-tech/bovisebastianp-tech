I</text><text x="260.0" y="252" font-size="16" fill="#5E5E64">Layout, warna, dan</text><text x="260.0" y="276" font-size="16" fill="#5E5E64">tampilan responsif</text><text class="m" x="260.0" y="320" font-size="13" fill="#8C8C92" letter-spacing="3">DIPAKAI DI</text><text x="260.0" y="348" font-size="16" font-weight="600" fill="#0A0A0B">Cahaya Dakwah</text><text x="260.0" y="372" font-size="16" font-weight="600" fill="#0A0A0B">SIPENIL</text><line x1="440.0" y1="40" x2="440.0" y2="380" stroke="#D2D2CE"/><rect x="464.0" y="56" width="68" height="34" rx="17" fill="#C4C4C0"><animate attributeName="fill" values="#C4C4C0;#0A0A0B;#0A0A0B;#C4C4C0;#C4C4C0" keyTimes="0;.25;.5;.75;1" dur="4s" repeatCount="indefinite"/></rect><circle cx="481.0" cy="73" r="12" fill="#F1F1EF"><animate attributeName="cx" values="481.0;515.0;515.0;481.0;481.0" keyTimes="0;.25;.5;.75;1" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines=".5 0 .2 1;0 0 1 1;.5 0 .2 1;0 0 1 1"/></circle><text class="s" x="460.0" y="168" font-size="32" font-weight="700" fill="#0A0A0B" letter-spacing="-.8">JavaScript</text><line x1="460.0" y1="186" x2="494.0" y2="186" stroke="#0A0A0B" stroke-width="2"/><text class="m" x="460.0" y="224" font-size="13" fill="#8C8C92" letter-spacing="3">FUNGSI</text><text x="460.0" y="252" font-size="16" fill="#5E5E64">Interaksi dan logika</text><text x="460.0" y="276" font-size="16" fill="#5E5E64">di sisi browser</text><text class="m" x="460.0" y="320" font-size="13" fill="#8C8C92" letter-spacing="3">DIPAKAI DI</text><text x="460.0" y="348" font-size="16" font-weight="600" fill="#0A0A0B">SIPENIL: kalkulasi</text><text x="460.0" y="372" font-size="16" font-weight="600" fill="#0A0A0B">Dakwah: pemutar</text><line x1="640.0" y1="40" x2="640.0" y2="380" stroke="#D2D2CE"/><rect x="660.0" y="46" width="72" height="52" rx="3" fill="none" stroke="#8C8C92" stroke-dasharray="4 3"/><rect x="660.0" y="46" width="72" height="52" rx="3" fill="#0A0A0B"><animateTransform attributeName="transform